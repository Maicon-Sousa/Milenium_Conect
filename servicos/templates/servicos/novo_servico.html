{% extends 'base.html' %}
{% load static %}

{% block 'head' %}
    <link rel="stylesheet" href="{% static 'clientes/css/clientes.css' %}">
{% endblock %}

{% block 'dashboard' %}
<br><br>
<div class="container">
    <h4 class="mb-4">Novo Agendamento</h4>
    <form action="{% url 'novo_servico' %}" method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <div class="mt-4">
            <button type="submit" class="btn btn-success px-4">
                📅 Agendar Serviço
            </button>
        </div>
    </form>
</div>
{% endblock %}
