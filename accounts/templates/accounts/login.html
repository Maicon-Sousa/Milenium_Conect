{% load static %}
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
    <title>Login - Milenium Conect</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            background-color: #8B2A2A;
            padding: 1.5rem;
            text-align: center;
        }

        .login-header h4 {
            color: #fff;
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .login-body {
            padding: 2rem 1.75rem;
        }

        .login-body label {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .login-body .form-control {
            background-color: #fff;
            border: none;
            border-radius: 6px;
            color: #222;
            margin-bottom: 1.25rem;
        }

        .login-body .form-control:focus {
            box-shadow: 0 0 0 2px #8B2A2A;
        }

        .btn-login {
            width: 100%;
            background-color: #D4622A;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #bf5522;
        }

        .login-footer {
            text-align: center;
            padding: 1rem;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #3a3a3a;
        }

        .alert-danger {
            background-color: #4a1a1a;
            border: none;
            color: #f5a5a5;
            font-size: 13px;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <h4>Milenium_conect</h4>
        </div>
        <div class="login-body">
            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <label>Usuário</label>
                <input type="text" class="form-control" name="username" placeholder="Seu usuário" required>
                <label>Senha</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
        <div class="login-footer">
            Milenium Conect &copy; 2024
        </div>
    </div>
</body>

</html>
